<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="color-scheme" content="dark light">
    <title>LostFilmTrack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 400px;
            min-width: 400px;
            max-width: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            margin: 0;
            padding: 0;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Светлая тема (по умолчанию) */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-header: #f6f8fa;
            --border: #d0d7de;
            --text-primary: #1f2328;
            --text-secondary: #57606a;
            --text-muted: #656d76;
            --accent: #0969da;
            --accent-hover: #1f883d;
            --item-hover: #f3f4f6;
            --scrollbar-track: #f1f1f1;
            --scrollbar-thumb: #c1c1c1;
            --episode-text: #0969da;
            --button-bg: #f6f8fa;
            --button-border: #d0d7de;
        }

        /* Темная тема */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0d1117;
                --bg-secondary: #161b22;
                --bg-header: #161b22;
                --border: #30363d;
                --text-primary: #c9d1d9;
                --text-secondary: #8b949e;
                --text-muted: #8b949e;
                --accent: #2f81f7;
                --accent-hover: #58a6ff;
                --item-hover: #1a2332;
                --scrollbar-track: #161b22;
                --scrollbar-thumb: #30363d;
                --episode-text: #a5d6ff;
                --button-bg: #0d1117;
                --button-border: #30363d;
            }
        }

        .header {
            padding: 12px 16px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            color: var(--text-primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .close-btn:hover {
            background: var(--item-hover);
            color: #f85149;
        }

        .close-btn:active {
            transform: scale(0.95);
        }

        .toggle {
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            padding: 5px 12px;
            font-size: 12px;
            background: var(--button-bg);
            border: 1px solid var(--button-border);
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s ease;
            font-weight: 500;
            white-space: nowrap;
        }

        .toggle-btn:active {
            transform: scale(0.96);
        }

        .toggle-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        #content {
            height: 450px;
            max-height: 450px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .item {
            display: block;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: var(--text-primary);
            transition: background 0.1s;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(47, 129, 247, 0.2);
        }

        .item:hover {
            background: var(--item-hover);
        }

        .title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            line-height: 1.4;
            word-break: break-word;
        }

        .title-rus {
            color: var(--text-primary);
        }

        .title-orig {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: 8px;
            word-break: break-word;
        }

        .info {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .day-header {
            padding: 8px 16px;
            background: var(--bg-secondary);
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
        }

        .loader {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        .refresh-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-header);
            border: none;
            border-top: 1px solid var(--border);
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .refresh-btn:hover {
            background: var(--item-hover);
        }

        .episode-desc {
            font-size: 11px;
            color: var(--episode-text);
            margin-top: 4px;
            line-height: 1.4;
            word-break: break-word;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
<div class="header">
    <h1>🎬 LostFilmTrack</h1>
    <div class="header-right">
        <div class="toggle">
            <button class="toggle-btn active" data-period="day">24ч</button>
            <button class="toggle-btn" data-period="week">7д</button>
        </div>
        <button class="close-btn" id="closeBtn" title="Закрыть">✕</button>
    </div>
</div>
<div id="content"><div class="loader"><div class="spinner"></div>Загрузка...</div></div>
<button class="refresh-btn" id="refreshBtn">⟳ Обновить</button>
<script src="popup.js"></script>
</body>
</html>
